<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rePressurizer — choose a design direction</title>
<link rel="icon" href="assets/logo-icon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
  img{height:72px;margin-bottom:28px}
  h1{font-size:28px;font-weight:600;margin-bottom:8px}
  p{color:#a1a1a6;margin-bottom:32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:min(620px,100%)}
  a{display:block;padding:28px;border-radius:16px;text-decoration:none;color:#fff;border:1px solid #333;transition:border-color .2s}
  a:hover{border-color:#C8622A}
  a b{display:block;font-size:22px;margin-bottom:6px}
  a span{color:#a1a1a6;font-size:14px}
</style>
</head>
<body>
  <img src="assets/logo-light.png" alt="ZERO WASTE · COOKING tennis">
  <h1>rePressurizer</h1>
  <p>Design preview — pick a direction.</p>
  <div class="grid">
    <a href="apple/"><b>A · Apple style</b><span>Product story, stats, light and dark sections</span></a>
    <a href="tesla/"><b>B · Tesla style</b><span>Full-screen video panels, minimal text</span></a>
  </div>
</body>
</html>
